<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Doroos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  :root { --accent: #7C3AED; --accent-soft: #EDE9FE; }
  @media (prefers-color-scheme: dark) { :root { --accent: #C4B5FD; --accent-ink: #2E1065; --accent-soft: #2E2156; } }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); width: min(94vw, 720px); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .cover { width: 100%; max-width: 320px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--muted); }
  .lesson { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .lesson .n { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
  .lessons { display: grid; gap: 6px; }
  .prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  td.num { white-space: nowrap; }
  .upbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .upbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="/admin.js"></script>
<script src="/demo.js"></script>
</body>
</html>
